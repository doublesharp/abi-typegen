[package]
name = "abi-typegen-e2e-rust"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone: not a member of the abi-typegen workspace.
[workspace]

[dependencies]
alloy = { version = "2", default-features = false, features = ["sol-types", "contract", "json-abi", "serde", "provider-http", "signer-local", "reqwest-rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "time"] }
