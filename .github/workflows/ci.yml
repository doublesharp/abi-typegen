name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test native engine report validators
        run: |
          python3 -m unittest e2e.native.godot.test_runner e2e.native.unreal.test_runner
          python3 e2e/native/unity/test_runner.py

  storage:
    name: Optional storage tooling
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: make test-storage

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps

  cargo-deny:
    name: Cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: stable
          arguments: --all-features

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download actionlint
        id: get_actionlint
        run: bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
        shell: bash
      - name: Check workflow files
        run: ${{ steps.get_actionlint.outputs.executable }} -color
        shell: bash

  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@v1
        with:
          config: ./_typos.toml

  npm-lint:
    name: npm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: npm/pnpm-lock.yaml
      - run: cd npm && pnpm install --frozen-lockfile --ignore-scripts
      - run: cd npm && pnpm run lint
      - run: cd npm && pnpm run format:check

  e2e-foundry:
    timeout-minutes: 30
    name: E2E Foundry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: e2e/foundry-sample/pnpm-lock.yaml
      - run: cargo build
      - run: node --test npm/tests/package.test.mjs
      - run: cd e2e/foundry-sample && forge build
      - run: cd e2e/foundry-sample && pnpm install --frozen-lockfile
      - run: cd e2e/foundry-sample && ../../target/debug/abi-typegen generate --artifacts ./out --out ./src/generated --target viem
      - run: cd e2e/foundry-sample && ../../target/debug/abi-typegen generate --artifacts ./out --out ./src/generated --target ethers
      - run: cd e2e/foundry-sample && pnpm exec tsc --noEmit
      - run: cd e2e/foundry-sample && pnpm run test:runtime
      - run: python3 e2e/native/anvil.py --cwd e2e/foundry-sample pnpm run test:anvil
      - run: cd e2e/foundry-sample && ../../target/debug/abi-typegen generate --artifacts ./out --out ./src/generated-zod --target zod
      - run: cd e2e/foundry-sample && pnpm exec tsc --noEmit -p tsconfig.zod.json
      - run: cd e2e/foundry-sample && ../../target/debug/abi-typegen generate --artifacts ./out --out ./src/generated-solidity --target solidity
      - run: cd e2e/foundry-sample && forge build --contracts ./solidity-validation --out ./out-solidity-validation

  e2e-native:
    timeout-minutes: 30
    name: E2E ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: go
            os: ubuntu-latest
          - target: rust
            os: ubuntu-latest
          - target: kotlin
            os: ubuntu-latest
          - target: swift
            os: macos-15
          - target: c
            os: ubuntu-latest
          - target: csharp
            os: ubuntu-latest
          - target: java
            os: ubuntu-latest
          - target: dart
            os: ubuntu-latest
          - target: ruby
            os: ubuntu-latest
          - target: elixir
            os: ubuntu-latest
          - target: shell
            os: ubuntu-latest
          - target: cobol
            os: ubuntu-latest
          - target: php
            os: ubuntu-latest
          - target: python
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            e2e/native/rust
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - if: matrix.target == 'elixir'
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29.1.1"
          elixir-version: "1.20.4"
          version-type: strict
      - if: matrix.target == 'elixir'
        uses: actions/cache@v4
        with:
          path: |
            e2e/native/elixir/deps
            e2e/native/elixir/_build
          key: ${{ runner.os }}-elixir-1.20.4-otp-29.1.1-${{ hashFiles('e2e/native/elixir/mix.lock') }}
      - if: matrix.target == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: e2e/native/go/go.mod
          cache-dependency-path: e2e/native/go/go.sum
      - if: matrix.target == 'kotlin' || matrix.target == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - if: matrix.target == 'kotlin' || matrix.target == 'java'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"
      - if: matrix.target == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - if: matrix.target == 'dart'
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.13.4"
      - if: matrix.target == 'php'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: curl, gmp, mbstring, iconv
          tools: composer:v2
          coverage: none
      - if: matrix.target == 'ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - if: matrix.target == 'ruby'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecp256k1-dev pkg-config
      - if: matrix.target == 'cobol'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol libcurl4-openssl-dev libjson-c-dev pkg-config
      - run: make e2e-${{ matrix.target }}

  e2e-hardhat:
    name: E2E Hardhat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: e2e/hardhat-sample/pnpm-lock.yaml
      - run: cargo build
      - name: Copy binary for Hardhat plugin
        run: mkdir -p npm/abi-typegen/bin && cp target/debug/abi-typegen npm/abi-typegen/bin/
      - run: cd e2e/hardhat-sample && pnpm install --frozen-lockfile
      - name: Compile (triggers abi-typegen via plugin)
        run: cd e2e/hardhat-sample && pnpm exec hardhat compile
      - name: Verify output was generated
        run: test -f e2e/hardhat-sample/abi-typegen-out/index.ts
