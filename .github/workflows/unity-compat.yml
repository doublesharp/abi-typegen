name: Unity compatibility

# Unity requires an activated Editor and Linux IL2CPP module. Keep this explicit
# until a qualified runner is available; ordinary binding CI remains independent.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unity:
    name: Editor, Anvil, and standalone players
    runs-on: [self-hosted, linux, unity-6000.6.3f1, unity-linux-il2cpp]
    timeout-minutes: 60
    env:
      UNITY_EDITOR: ${{ vars.UNITY_EDITOR_6000_6_3F1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify result validation
        run: python3 e2e/native/unity/test_runner.py
      - name: Regenerate bindings and qualify Unity
        run: make e2e-unity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-results
          path: |
            e2e/native/unity/TestResults
            e2e/native/unity/Build/**/build.log
            e2e/native/unity/Build/**/player.log
