[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
ignore = [
  # `paste` is unmaintained but has no known vulnerability. It is a compile-time
  # proc-macro dependency of alloy-primitives, which abi-typegen-core uses for
  # keccak-256 selectors and B256/FixedBytes types.
  { id = "RUSTSEC-2024-0436", reason = "unmaintained proc-macro pulled in by alloy-primitives; no vulnerability" },
]
